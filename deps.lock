# 打包工具的外部依赖（都是固定版本，保证构建可复现）
#
# 改这里之前先读 rustomp/docs/ecosystem.md §7「已知风险」。
# 与 rustomp-mac-plugin/deps.lock 保持**同一个 nih-plug rev**：两台机器的打包行为必须一致。

# nih-plug：插件框架（插件仓的 Cargo.toml 里也是这个 rev）
nih-plug-repo = https://github.com/robbert-vdh/nih-plug.git
nih-plug-rev  = de42101
# 打包用的 cargo 子命令必须与上面的 rev 一致，否则 bundler 行为可能不同
# （Windows 上 `bundle-universal` 不可用，只能用 `bundle`）
cargo-nih-plug-install = cargo install --git https://github.com/robbert-vdh/nih-plug.git --rev de42101 cargo-nih-plug --locked

# Rust 目标：Windows 只有 MSVC 可行（vst3-sys 要编 Steinberg 的 C++；GNU ABI 与宿主不兼容）
rust-target       = x86_64-pc-windows-msvc
rust-target-arm64 = aarch64-pc-windows-msvc
# arm64 交叉还需要 MSVC 的 ARM64 工具集（vcvarsamd64_arm64.bat）：
#   setup.exe modify --installPath "<BuildTools 路径>" \
#     --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --quiet --norestart
# 注意：--quiet 必须是**一开始就提权**的进程，否则安装器直接退出码 5007。

# CLAP SDK：仅供 tools/clap-probe 编译（读取 .clap 的端口/参数/身份）
# 与 mac 仓同一个 tag，避免两边探针看到的 ABI 不同。
clap-sdk-tag = 1.2.9

# 宿主侧验证器（可选，但强烈建议）：Tracktion 的 pluginval
pluginval-release = v1.0.3
pluginval-url     = https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_Windows.zip

# MSI 打包（可选）：WiX Toolset 3.14 的**免安装二进制 zip**
# 选 v3 而不是 v4/v5 的原因：v4+ 是 dotnet tool，必须装 .NET SDK（约 500 MB）；
# v3 的 candle/light 是独立 exe（运行时只要 .NET Framework 3.5，Win10 自带可启用）。
wix-release      = wix3141rtm
wix-binaries-url = https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
